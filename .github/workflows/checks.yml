name: Checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, typecheck, and build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check formatting
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn tsc --noEmit

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Preserve crawler executable bit
        run: chmod +x dist/bin/yuuka-crawler

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuuka-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
